<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulateur de bourse</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f5f2;--panel:#fff;--ink:#17211b;--mute:#6a766e;--line:#dfe5df;--side:#14301f;--acc:#1f7a4d;--up:#1a8a4f;--down:#c8402f;--blue:#2d6cdf}
@media (prefers-color-scheme:dark){:root{--bg:#0e1511;--panel:#16201a;--ink:#e8efe9;--mute:#8fa097;--line:#25332a;--side:#0a1e12;--acc:#3fbf80;--up:#3fbf80;--down:#ef6b58;--blue:#6aa0ff}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:"Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);display:flex}
aside{width:210px;background:var(--side);color:#dfeee4;padding:22px 14px;display:flex;flex-direction:column;gap:6px;flex-shrink:0}
aside h1{font-size:17px;margin:0 8px 18px;font-weight:700;letter-spacing:.2px}
aside button{all:unset;cursor:pointer;padding:10px 12px;border-radius:8px;font-size:14.5px}
aside button:hover{background:rgba(255,255,255,.08)}
aside button.on{background:rgba(255,255,255,.16);font-weight:600}
aside button:focus-visible,.btn:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
aside .reset{margin-top:auto;font-size:12.5px;opacity:.7}
main{flex:1;overflow:auto;padding:26px 30px;min-width:0}
h2{margin:0 0 18px;font-size:24px}
h3{margin:0 0 12px;font-size:15px}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-bottom:14px}
.two{grid-template-columns:2fr 1fr;margin-bottom:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.kpi small{color:var(--mute);font-size:12.5px}
.kpi b{display:block;font-size:22px;margin-top:4px;font-variant-numeric:tabular-nums}
.up{color:var(--up)}.down{color:var(--down)}
table{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
th,td{text-align:right;padding:9px 8px;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
th{color:var(--mute);font-weight:600;font-size:12.5px}
.scroll{overflow-x:auto}
.btn{all:unset;cursor:pointer;background:var(--acc);color:#fff;padding:7px 13px;border-radius:7px;font-size:13px;font-weight:600}
.btn.sell{background:var(--down)}
.btn:hover{filter:brightness(1.1)}
input[type=number]{width:80px;padding:6px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
.mk{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.mk .row{display:flex;gap:8px;align-items:center;margin-top:12px}
.price{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.legend{display:flex;flex-direction:column;gap:6px;font-size:13px;margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px}
.empty{color:var(--mute);font-size:14px;padding:10px 0}
.donutwrap{display:flex;flex-direction:column;align-items:center}
#toast{z-index:30;position:fixed;bottom:20px;right:20px;background:var(--side);color:#fff;padding:10px 16px;border-radius:8px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.show{opacity:1}
@media(max-width:760px){body{flex-direction:column}aside{width:100%;flex-direction:row;flex-wrap:wrap;padding:10px}aside h1{width:100%;margin:0 4px 4px}aside .reset{margin:0 0 0 auto}main{padding:16px}.two{grid-template-columns:1fr}}
.logo{width:30px;height:30px;border-radius:8px;object-fit:contain;background:#fff;vertical-align:middle;margin-right:8px;padding:2px}
.logo.ph{display:inline-flex;align-items:center;justify-content:center;background:var(--acc);color:#fff;font-weight:700;font-size:14px}
.clk{cursor:pointer}.clk:hover{border-color:var(--acc)}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:16px;z-index:5}
#modal.on{display:flex}
#modal .box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;width:100%;max-width:700px;max-height:92vh;overflow:auto}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.mh h2{margin:0;font-size:21px}
.lnk{color:var(--blue);font-size:13.5px;text-decoration:none}
.ctl{padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);font:inherit}
.star{all:unset;cursor:pointer;float:right;font-size:19px;color:#e0a526;line-height:1}
aside{overflow:auto}
:root[data-theme=light]{--bg:#f3f5f2;--panel:#fff;--ink:#17211b;--mute:#6a766e;--line:#dfe5df;--side:#14301f;--acc:#1f7a4d;--up:#1a8a4f;--down:#c8402f;--blue:#2d6cdf}
:root[data-theme=dark]{--bg:#0e1511;--panel:#16201a;--ink:#e8efe9;--mute:#8fa097;--line:#25332a;--side:#0a1e12;--acc:#3fbf80;--up:#3fbf80;--down:#ef6b58;--blue:#6aa0ff}
#welcome{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:18px;overflow:auto;background:linear-gradient(155deg,#0c2417 0%,#14532d 55%,#1f7a4d 100%)}
#welcome.on{display:flex}
.wcard{background:var(--panel);color:var(--ink);border-radius:16px;padding:28px 26px;width:100%;max-width:400px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.wcard h1{margin:6px 0 4px;font-size:24px}.wcard h2{margin:18px 0 12px;font-size:18px}
.wlogo{font-size:38px}.wsub{color:var(--mute);font-size:13.5px;margin:0}
.wi{display:block;width:100%;margin:8px 0;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;font-size:15px}
.wbtn{all:unset;box-sizing:border-box;display:block;width:100%;margin-top:12px;padding:12px;border-radius:9px;background:var(--acc);color:#fff;font-weight:700;cursor:pointer;text-align:center}
.wbtn:hover{filter:brightness(1.1)}
.wlink{all:unset;display:block;margin:12px auto 0;color:var(--blue);font-size:13px;cursor:pointer}
.werr{color:var(--down);font-size:13px;min-height:18px;margin-top:6px}
.wnote{color:var(--mute);font-size:12px;margin:14px 0 0}
.wlist{display:flex;flex-direction:column;gap:8px;margin-bottom:4px}
.wchar{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:12px;padding:10px 14px;border:1px solid var(--line);border-radius:10px;font-weight:600}
.wchar:hover{border-color:var(--acc)}
.wav{font-size:26px}.wbig{font-size:54px;margin-top:14px}
.wavs{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:10px 0}
.wavl{position:relative}.wavl input{position:absolute;opacity:0}
.wavl span{display:inline-flex;width:44px;height:44px;align-items:center;justify-content:center;font-size:24px;border:2px solid var(--line);border-radius:10px;cursor:pointer}
.wavl input:checked+span{border-color:var(--acc);background:rgba(31,122,77,.15)}
.wavl input:focus-visible+span,.wchar:focus-visible,.wbtn:focus-visible,.wlink:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.rng{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.rb{all:unset;cursor:pointer;padding:5px 12px;border-radius:16px;border:1px solid var(--line);font-size:13px}
.rb:hover{border-color:var(--acc)}.rb.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.rb:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.ig{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:12px 0}
.ig div{background:var(--bg);border-radius:8px;padding:8px 10px}.ig small{display:block;color:var(--mute);font-size:11.5px}.ig b{font-size:14px;font-variant-numeric:tabular-nums}
/* ===== identité : salle des marchés (encre, sarcelle, safran) ===== */
:root{--bg:#f3f5f9;--panel:#fff;--ink:#0f1c2e;--mute:#5d6b80;--line:#e1e6ee;--side:#0f1c2e;--acc:#0f8b8d;--up:#0f9d63;--down:#d6443f;--blue:#2f5bea;--gold:#e9a820}
@media (prefers-color-scheme:dark){:root{--bg:#0b1320;--panel:#121c2d;--ink:#e7edf6;--mute:#8d9bb0;--line:#223048;--side:#080f1a;--acc:#3cc9c4;--up:#34d399;--down:#f4726b;--blue:#7ea3ff;--gold:#f2c14e}}
:root[data-theme=light]{--bg:#f3f5f9;--panel:#fff;--ink:#0f1c2e;--mute:#5d6b80;--line:#e1e6ee;--side:#0f1c2e;--acc:#0f8b8d;--up:#0f9d63;--down:#d6443f;--blue:#2f5bea;--gold:#e9a820}
:root[data-theme=dark]{--bg:#0b1320;--panel:#121c2d;--ink:#e7edf6;--mute:#8d9bb0;--line:#223048;--side:#080f1a;--acc:#3cc9c4;--up:#34d399;--down:#f4726b;--blue:#7ea3ff;--gold:#f2c14e}
*{scrollbar-width:thin;scrollbar-color:var(--line) transparent}
body{font-family:"Plus Jakarta Sans","Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif}
.col{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
main{padding:24px 32px 40px}
h2{font-size:26px;font-weight:800;letter-spacing:-.02em;margin:0 0 20px}
h3{font-weight:700}
.card{border-radius:10px;box-shadow:none}
aside{width:224px;padding:20px 12px;gap:2px}
aside h1{font-size:17px;font-weight:800;letter-spacing:-.01em;margin:2px 10px 4px}
#who{display:flex;gap:10px;align-items:center;margin:8px 4px 18px;padding:10px;border-radius:10px;background:rgba(255,255,255,.07)}
#who b{display:block;font-size:14px;color:#fff}#who small{color:#9fb3cc;font-size:12px}.wavs1{font-size:26px}
aside button,#news{border-radius:8px;color:#c6d4e6;font-weight:500}
aside button:hover,#news:hover{background:rgba(255,255,255,.07);color:#fff}
aside button.on{background:rgba(255,255,255,.1);color:#fff;font-weight:700;box-shadow:inset 3px 0 0 #3cc9c4}
#tape{background:var(--side);color:#cfe0f5;overflow:hidden;white-space:nowrap;font-size:13px;height:36px;display:flex;align-items:center;flex-shrink:0;border-bottom:1px solid rgba(255,255,255,.08)}
.tapetrack{display:inline-block;animation:tape linear infinite;will-change:transform}
#tape:hover .tapetrack{animation-play-state:paused}
.ti{display:inline-block;padding:0 20px;border-right:1px solid rgba(255,255,255,.14);font-variant-numeric:tabular-nums}
.ti b{color:#fff;margin-right:8px;font-weight:700}.ti i{font-style:normal;margin-left:8px;font-weight:600}
.ti i.up{color:#5be3a8}.ti i.down{color:#ff8f88}.tapeempty{padding:0 20px;color:#9fb3cc}
@keyframes tape{to{transform:translateX(-50%)}}
.kpi small{font-size:12.5px;color:var(--mute);font-weight:500}
.kpi b{font-size:22px;letter-spacing:-.02em;margin-top:6px;font-weight:700}
@media(min-width:1250px){.kpis .card:nth-child(2){grid-column:span 2}.kpis .card:nth-child(2) b{font-size:34px}}
.price{font-size:22px;font-weight:700;letter-spacing:-.02em}
.chg.up,.chg.down{display:inline-block;padding:1px 9px;border-radius:99px;font-weight:600;background:color-mix(in srgb,currentColor 14%,transparent)}
.btn{border-radius:8px;padding:8px 14px}
.logo{border:1px solid var(--line);border-radius:8px}
#modal{background:rgba(8,15,26,.6);backdrop-filter:blur(4px)}
#modal .box{border-radius:14px}
#modal.on .box{animation:pop .16s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(6px)}}
#toast{border-radius:10px;font-weight:600}
.lvl{display:flex;gap:18px;align-items:center;margin-bottom:6px}
.lvlbig{font-size:40px;font-weight:800;line-height:1;width:76px;height:76px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--ink);color:var(--panel);letter-spacing:-.03em;flex-shrink:0}
.gcat{margin:26px 0 10px;font-size:16px}
.goals{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.goal{display:flex;gap:12px;align-items:flex-start}
.goal .gi{font-size:24px;width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--bg);flex-shrink:0}
.goal .gb{min-width:0;flex:1}.goal p{margin:2px 0 8px;color:var(--mute);font-size:13px}.goal small{color:var(--mute);font-size:12px}
.goal.done{border-color:var(--gold);box-shadow:inset 3px 0 0 var(--gold)}
.gok{float:right;font-size:11.5px;font-weight:700;color:var(--ink);background:color-mix(in srgb,var(--gold) 32%,transparent);padding:1px 8px;border-radius:99px}
.pbar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin:2px 0 4px}
.pbar i{display:block;height:100%;background:var(--acc);border-radius:99px;transition:width .4s}
.pbar.sm{height:6px;flex:1;margin:0}
.grow{display:flex;align-items:center;gap:12px;margin:8px 0;font-size:13.5px}.grow>span{width:200px;flex-shrink:0}
#welcome{background:linear-gradient(160deg,#0a1626,#0f2a3f 60%,#0f4a52)}

.wcard{position:relative;z-index:1;border-radius:16px}.wcard h1{font-weight:800;letter-spacing:-.02em}
.wbtn{border-radius:10px}
@media(prefers-reduced-motion:reduce){.tapetrack{animation:none}#tape{overflow-x:auto}#modal.on .box{animation:none}.pbar i{transition:none}}
@media(max-width:760px){.col{min-height:0}main{padding:16px}.grow>span{width:130px}aside{width:100%}}
.ntitle{margin:18px 0 6px;font-size:15px}
.nsum{font-size:13px;margin:0 0 6px;color:var(--mute)}
.nit{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line);text-decoration:none;color:var(--ink)}
.nit:hover b{text-decoration:underline}
.nit b{display:block;font-size:13.5px;font-weight:600;line-height:1.35}.nit small{color:var(--mute);font-size:12px}
.nd{flex-shrink:0;width:10px;height:10px;border-radius:50%;margin-top:5px;background:var(--mute)}.nd.p{background:var(--up)}.nd.n{background:var(--down)}
.nnote{font-size:11.5px;color:var(--mute);margin-top:8px}.nlinks{font-size:13px;margin-top:8px}
.btabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.btab{all:unset;cursor:pointer;padding:10px 16px;border-radius:10px;border:1px solid var(--line);font-weight:600;font-size:14px;background:var(--panel)}
.btab:hover{border-color:var(--acc)}.btab.on{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.btab:focus-visible,.btoc button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.book{display:grid;grid-template-columns:240px 1fr;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel)}
.btoc{background:var(--bg);padding:12px 8px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.btoc button{all:unset;box-sizing:border-box;cursor:pointer;padding:8px 10px;border-radius:8px;font-size:13.5px;color:var(--mute)}
.btoc button:hover{background:var(--panel)}.btoc button.on{background:var(--panel);color:var(--ink);font-weight:700;box-shadow:inset 3px 0 0 var(--acc)}
.btoc button.read::after{content:" ✓";color:var(--up)}
.bpage{padding:28px 34px;min-height:360px}.bpage .bn{color:var(--mute);font-size:13px;margin-bottom:4px}
.bpage h3{font-size:22px;margin:0 0 14px;letter-spacing:-.01em}
.bpage p,.bpage li{font-size:15px;line-height:1.65}.bpage ul{padding-left:20px}.bpage li{margin:6px 0}
.gtip{margin-top:16px;padding:12px 14px;border-left:3px solid var(--gold);background:color-mix(in srgb,var(--gold) 14%,transparent);border-radius:0 8px 8px 0;font-size:14px;line-height:1.55}
.gex{margin:14px 0;padding:12px 14px;border:1px dashed var(--line);border-radius:8px;font-size:14px;line-height:1.55;background:var(--bg)}
.bfoot{display:flex;justify-content:space-between;gap:10px;padding:14px 34px;border-top:1px solid var(--line)}
.btn[disabled]{opacity:.4;cursor:default;pointer-events:none}
details.nnote summary{cursor:pointer}
@media(max-width:760px){.book{grid-template-columns:1fr}.btoc{border-right:0;border-bottom:1px solid var(--line);flex-direction:row;overflow-x:auto}.btoc button{white-space:nowrap}.bpage{padding:20px 18px}.bfoot{padding:12px 18px}}
</style>

<aside>

function buy(sym,amt,auto){
  amt=parseFloat(amt);
  if(!(amt>0)){if(!auto)toast("Entre un montant en euros.");return false}
  if(amt>S.cash+1e-9){if(!auto)toast("Capital disponible insuffisant.");return false}
  if(!ready(sym)){if(!auto)toast("Le cours de cette entreprise n'est pas encore chargé…");return false}
  const pr=S.prices[sym],fee=amt*FEE,net=amt-fee,q=net/pr,p=S.pos[sym]||{qty:0,avg:0};
  p.avg=(p.qty*p.avg+net)/(p.qty+q);p.qty+=q;S.pos[sym]=p;S.cash-=amt;
  S.hist.unshift({t:Date.now(),type:"Achat",sym,qty:q,price:pr,amt,fee,auto});
  if(!auto){snap();save();toast("Achat de "+STOCKS[sym][0]+" : "+eur(amt));render();if(openSym)drawModal()}
  return true;
}
function sell(sym,auto){
  const p=S.pos[sym];if(!p)return false;
  const pr=S.prices[sym],gross=p.qty*pr,fee=gross*FEE,net=gross-fee;
  S.cash+=net;S.hist.unshift({t:Date.now(),type:"Vente",sym,qty:p.qty,price:pr,amt:net,fee,auto,pnl:net-p.qty*p.avg});

}

async function yahooChart(symbol,range="1d",interval="1m"){
  const url="https://query1.finance.yahoo.com/v8/finance/chart/"+encodeURIComponent(symbol)+"?range="+encodeURIComponent(range)+"&interval="+encodeURIComponent(interval)+"&includePrePost=false";

}
async function loadYahooQuote(k){

  if(!(price>0))throw new Error("aucun cours Yahoo pour "+k);
  await getRate();const pc=+(m.chartPreviousClose||m.previousClose||price),cv=v=>+v>0&&isFinite(+v)?+v*rate:0;
  S.prices[k]=price*rate;S.open[k]=pc*rate;S.pt[k]=Date.now();

async function loadQuotes(ks){
  if(!ks.length)return 0;
  lastYahooAttempt=Date.now();let ok=0;
  // Yahoo Finance est tenté en premier. Chaque titre est demandé séparément car son endpoint de graphique n'offre pas de lot fiable.
  try{
    await Promise.all(ks.map(async k=>{try{await loadYahooQuote(k);ok++}catch(e){}}));
  }catch(e){}
  if(ok){yahooErr=false;S.source="Yahoo Finance";liveErr=false;S.live=hhmm();snap();saveSoon();setStatus();render(true);return ok;}
  yahooErr=true;
  // Repli sur Twelve Data si une clé personnelle a été configurée.
  if(APIKEY&&!liveErr){
    let j;try{await getRate();j=await tdGet("quote","symbol="+ks.map(encodeURIComponent).join(","),ks.length)}catch(e){warn("Yahoo indisponible ; Twelve Data inaccessible ("+String(e.message||e).slice(0,60)+").");setStatus();return 0}
    if(j&&j.status==="error"&&!j[ks[0]]){apiFail(j);setStatus();return 0}
    const m=ks.length===1&&!j[ks[0]]?{[ks[0]]:j}:j;

const LEVELS=[[0,"Débutant"],[3,"Apprenti"],[7,"Investisseur"],[12,"Expert"],[17,"Stratège"],[23,"Légende"]];
function levelOf(n){let i=0;LEVELS.forEach((l,k)=>{if(n>=l[0])i=k});return{n:i+1,name:LEVELS[i][1],next:LEVELS[i+1]}}
function checkGoals(silent){
  let changed=false;
  for(const g of GOALS){if(S.ach[g.id])continue;const[c,t]=g.p();if(c>=t){S.ach[g.id]=Date.now();changed=true;if(!silent)notify("🏆 Objectif débloqué : "+g.t)}}
  if(changed){const lv=levelOf(Object.keys(S.ach).length);if(!silent)notify("Niveau "+lv.n+" · "+lv.name);setWho();saveSoon()}
}
function setWho(){
  const el=document.getElementById("who");if(!el||!PROFILE)return;const lv=levelOf(GOALS.filter(g=>S.ach[g.id]).length);
  el.innerHTML=`<span class="wavs1">${(users()[PROFILE]||{}).av||"👤"}</span><div><b>${esc(PROFILE)}</b><small>Niveau ${lv.n} · ${lv.name}</small></div>`;
}
function goalCard(g){
  const done=!!S.ach[g.id],[c,t]=g.p(),pc=Math.round(Math.min(1,c/t)*100);
  const f=v=>g.u==="€"?eur(v):g.u==="%"?v.toFixed(1).replace(".",",")+" %":String(Math.floor(v));
  const tt=g.u==="€"?eur(t):g.u==="%"?t+" %":t;
  return`<div class="card goal ${done?"done":""}"><div class="gi">${g.ic}</div><div class="gb"><b>${g.t}</b>${done?'<span class="gok">Débloqué</span>':""}<p>${g.d}</p>${done?`<small>le ${new Date(S.ach[g.id]).toLocaleDateString("fr-FR")}</small>`:`<div class="pbar"><i style="width:${pc}%"></i></div><small>${f(c)} sur ${tt}</small>`}</div></div>`;
}
function goalsView(){
  const done=GOALS.filter(g=>S.ach[g.id]).length,N=GOALS.length,lv=levelOf(done),nx=lv.next;
  const head=`<div class="card lvl"><div class="lvlbig">${lv.n}</div><div style="flex:1"><h3 style="margin:0;font-size:18px">${lv.name}</h3><p style="margin:2px 0 10px;color:var(--mute);font-size:13.5px">${done} objectif${done>1?"s":""} débloqué${done>1?"s":""} sur ${N}${nx?" · encore "+(nx[0]-done)+" pour devenir "+nx[1]:" · tu as tout débloqué, bravo !"}</p><div class="pbar"><i style="width:${Math.round(done/N*100)}%"></i></div></div></div>`;
  const cats=[...new Set(GOALS.map(g=>g.cat))];
  return`<h2>Objectifs</h2>${head}${cats.map(c=>`<h3 class="gcat">${c}</h3><div class="grid goals">${GOALS.filter(g=>g.cat===c).map(goalCard).join("")}</div>`).join("")}`;
}
let GP={part:0,page:0};
const m_top=()=>{const m=document.getElementById("main");if(m)m.scrollTop=0};
function guideMark(){const k=GP.part+"-"+GP.page;if(!S.read[k]){S.read[k]=1;checkGoals();saveSoon()}}
function guideView(){
  const P=GUIDE[GP.part],pg=P.pages[GP.page],last=GP.page===P.pages.length-1,first=GP.page===0,end=last&&GP.part===GUIDE.length-1;
  const tabs=GUIDE.map((p,i)=>`<button class="btab ${i===GP.part?"on":""}" data-gpart="${i}">${p.ic} Partie ${i+1} · ${p.title}</button>`).join("");
  const toc=P.pages.map((x,i)=>`<button class="${i===GP.page?"on":""} ${S.read[GP.part+"-"+i]?"read":""}" data-gpage="${i}">${i+1}. ${x.t}</button>`).join("");
  return`<h2>Livret du jeu</h2><div class="btabs">${tabs}</div><div class="book"><nav class="btoc" aria-label="Sommaire">${toc}</nav><article><div class="bpage"><div class="bn">Partie ${GP.part+1} · page ${GP.page+1} sur ${P.pages.length}</div><h3>${pg.t}</h3>${pg.b}</div><div class="bfoot"><button class="btn" data-gnav="prev" ${first&&GP.part===0?"disabled":""} style="background:var(--mute)">Page précédente</button><button class="btn" data-gnav="next" ${end?"disabled":""}>${last&&!end?"Partie suivante":"Page suivante"}</button></div></article></div>`;
}
const GUIDE=[
{title:"Comment fonctionne le jeu",ic:"🎮",pages:[
{t:"Le but du jeu",b:`<p>Tu démarres avec <strong>250 € virtuels</strong>. Ton objectif : les faire fructifier en achetant et en revendant des actions d'entreprises cotées en bourse.</p>
<p>L'argent est fictif, donc <strong>tu ne risques rien</strong>. Les prix, eux, sont ceux de la vraie bourse quand les vrais cours sont activés.</p>
<p>Ta fortune, c'est l'argent qu'il te reste <strong>plus</strong> la valeur de tes actions. Tu gagnes quand elle dépasse ton capital de départ.</p>
<div class="gtip"><strong>À retenir :</strong> c'est un jeu pour apprendre. Ce n'est pas un conseil en investissement.</div>`},
{t:"Ton personnage et le menu",b:`<p>Au démarrage, tu crées un <strong>personnage</strong> : un pseudo, un mot de passe et un avatar. Il est enregistré sur ton appareil, pas en ligne. Chaque personnage a son propre compte.</p>
<ul><li><strong>Vue générale</strong> : ta fortune, ton graphique, tes objectifs et le classement des personnages.</li><li><strong>Portefeuille</strong> : tes actions, tes gains, ton historique.</li><li><strong>Marchés</strong> : toutes les entreprises à acheter.</li><li><strong>Objectifs</strong> et <strong>Guide</strong> : ce livret.</li></ul>
<p>Le <strong>bandeau défilant</strong> en haut montre les cours (passe la souris dessus pour le mettre en pause). En bas du menu : changer de personnage, thème clair ou sombre, export de l'historique en fichier Excel (CSV) et remise à zéro (retour à 250 €).</p>
<div class="gtip"><strong>Mot de passe oublié ?</strong> Il ne peut pas être récupéré : depuis l'écran de connexion, tu peux supprimer le personnage et en créer un nouveau.</div>`},
{t:"D'où viennent les cours",b:`<p>Dans le menu, une pastille indique l'état des prix :</p>
<ul><li><strong>Cours réels</strong> : les vrais prix de la bourse. L'appli essaie d'abord Yahoo Finance sans clé, puis Twelve Data si tu as ajouté une clé gratuite (bouton 🔑).</li><li><strong>Cours simulés</strong> : des prix inventés qui bougent au hasard. Pratique pour jouer, mais sans vraies courbes ni actualités.</li></ul>
<p>Les cours se chargent <strong>petit à petit</strong> (limites gratuites des sites). Un « — » veut dire que le cours n'est pas encore arrivé : l'achat est bloqué jusqu'à son chargement. Ouvrir une entreprise charge son cours tout de suite.</p>
<p>Les prix sont convertis en <strong>euros</strong> avec le taux du jour. La bourse américaine est ouverte en général de <strong>15 h 30 à 22 h</strong> (heure de Paris), du lundi au vendredi. En dehors, le cours reste celui de la dernière clôture.</p>`},
{t:"Acheter et vendre",b:`<p>Dans <strong>Marchés</strong>, choisis une entreprise, écris un montant en euros puis clique sur <strong>Acheter</strong>. Tu peux acheter une <strong>fraction d'action</strong> : avec 10 €, tu en achètes juste ce que 10 € permettent.</p>
<p>Chaque achat et chaque vente coûte <strong>0,2 % de frais</strong>, comme chez un courtier. Le <strong>prix moyen</strong> de ta position est la moyenne de tes achats.</p>
<p>Pour vendre, utilise <strong>Vendre</strong> dans le Portefeuille ou <strong>Vendre tout</strong> dans la fiche de l'entreprise. L'argent revient dans ton capital disponible.</p>
<div class="gex"><strong>Exemple :</strong> tu achètes 50 € d'une action qui vaut 100 €. Les frais sont de 0,10 €, donc tu reçois 49,90 / 100 = <strong>0,499 action</strong>.</div>`},
{t:"La fiche d'une entreprise",b:`<p>Clique sur une carte pour ouvrir sa fiche :</p>
<ul><li>le <strong>prix</strong> et sa variation par rapport à la clôture précédente ;</li><li>la <strong>courbe</strong>, avec des périodes de 1 h à 1 an ;</li><li>des <strong>infos</strong> : ouverture, plus haut et plus bas du jour, volume, repères sur 52 semaines ;</li><li>l'<strong>achat</strong>, la <strong>vente</strong> et les <strong>ordres à seuil</strong> ;</li><li>les <strong>actualités récentes</strong> trouvées sur Internet, avec une pastille verte ou rouge. Ce classement est indicatif : il repose sur des mots du titre.</li></ul>
<p>Dans Marchés, l'étoile ★ met une entreprise en favori (elle passe en premier). Tu peux aussi chercher par nom, filtrer par secteur, trier, et cliquer sur « Afficher plus ».</p>`},
{t:"Les ordres à seuil",b:`<p>Un ordre à seuil achète ou vend <strong>à ta place</strong> quand le prix atteint le niveau que tu as choisi.</p>
<ul><li><strong>Acheter si prix ≤</strong> : dès que le prix descend jusqu'au seuil, l'appli achète le montant indiqué.</li><li><strong>Vendre si prix ≥</strong> : dès que le prix monte jusqu'au seuil, l'appli vend toute ta position.</li></ul>
<p>Les ordres ne fonctionnent que <strong>tant que l'appli est ouverte</strong>. Tu les retrouves dans Portefeuille, « Ordres en attente », et tu peux les annuler. L'ordre s'exécute au prix du moment, qui peut être un peu différent du seuil.</p>`},
{t:"Suivre ton portefeuille",b:`<p>La page <strong>Portefeuille</strong> te dit où tu en es :</p>
<ul><li><strong>Capital disponible</strong> : l'argent pas encore investi.</li><li><strong>Valeur du portefeuille</strong> : argent + valeur de tes actions.</li><li><strong>Argent investi</strong> : ce que tes actions t'ont coûté.</li><li><strong>Gains et pertes</strong> : en euros et en pourcentage par rapport à ta mise de départ.</li></ul>
<p>Tu y trouves aussi le graphique de ton compte, la répartition en camembert, le tableau de tes actions, le classement de tes meilleurs et pires placements et l'historique de toutes tes opérations.</p>`},
{t:"Objectifs et niveaux",b:`<p>Le jeu propose <strong>23 objectifs</strong> répartis en quatre familles : pour bien démarrer, construire son portefeuille, faire fructifier, devenir un pro.</p>
<p>Chaque objectif débloqué te fait gagner des niveaux, de <strong>Débutant</strong> à <strong>Légende</strong>. Une notification apparaît à chaque déblocage, et ton niveau est affiché dans le menu.</p>
<p>Lire tout ce livret est aussi un objectif.</p>`},
{t:"Bon à savoir",b:`<ul><li>Tes données sont <strong>sauvegardées dans ce navigateur</strong>. Si tu effaces les données du site, elles disparaissent : pense à exporter ton historique.</li><li>Les sites gratuits limitent le nombre de demandes : si les cours tardent, patiente un peu.</li><li>Si les cours réels sont bloqués, l'appli passe en cours simulés et le dit clairement dans le menu.</li><li>Les actualités viennent de sites publics : si aucune source ne répond, des liens directs sont proposés.</li></ul>
<div class="gtip"><strong>Rappel :</strong> ce simulateur est un outil d'apprentissage. Il ne donne aucun conseil financier.</div>`}
]},
{title:"Les bases de la bourse",ic:"📚",pages:[
{t:"Qu'est-ce qu'une action ?",b:`<p>Une <strong>action</strong> est une petite part de propriété d'une entreprise. Si une société est divisée en un million d'actions et que tu en détiens une, tu possèdes un millionième de l'entreprise.</p>
<p>Les entreprises émettent des actions pour trouver l'argent dont elles ont besoin pour se développer. En retour, un actionnaire peut gagner de deux façons :</p>
<ul><li>la <strong>plus-value</strong> : revendre l'action plus cher qu'on l'a payée ;</li><li>le <strong>dividende</strong> : une part des bénéfices que certaines entreprises versent à leurs actionnaires (pas toutes).</li></ul>
<div class="gtip"><strong>Attention :</strong> si le cours baisse, ta part vaut moins. Si l'entreprise fait faillite, l'action peut perdre toute sa valeur.</div>`},
{t:"La bourse et les indices",b:`<p>La <strong>bourse</strong> est un marché organisé où acheteurs et vendeurs se rencontrent. Le prix d'une action, le <strong>cours</strong>, résulte de l'<strong>offre et de la demande</strong> : s'il y a plus d'acheteurs que de vendeurs, il monte ; dans le cas inverse, il baisse.</p>
<p>Les grandes places sont New York (NYSE et Nasdaq), Paris (Euronext), Londres, Tokyo… Ce simulateur propose des entreprises cotées aux États-Unis, y compris des entreprises étrangères qui y sont cotées.</p>
<p>Un <strong>indice</strong> est un panier d'entreprises qui résume l'état d'un marché : le <strong>S&amp;P 500</strong> (500 grandes entreprises américaines), le <strong>CAC 40</strong> (40 grandes entreprises françaises), le <strong>Nasdaq 100</strong> (grandes entreprises du Nasdaq, souvent technologiques).</p>
<p>La bourse de New York est ouverte de 9 h 30 à 16 h, heure locale, soit en général de 15 h 30 à 22 h à Paris.</p>`},
{t:"Pourquoi un cours bouge",b:`<p>Le cours change en permanence parce que les investisseurs révisent leur avis sur l'<strong>avenir</strong> de l'entreprise. Les principales causes :</p>
<ul><li>les <strong>résultats</strong> (chiffre d'affaires, bénéfices), comparés à ce que le marché attendait ;</li><li>les <strong>nouvelles</strong> : nouveau produit, procès, changement de dirigeant, accord ;</li><li>l'<strong>économie</strong> : inflation, croissance, décisions des banques centrales. Quand les taux d'intérêt montent, les actions peuvent souffrir ;</li><li>le <strong>secteur</strong> : une bonne ou mauvaise nouvelle touche souvent toutes les entreprises du même domaine ;</li><li>l'<strong>humeur</strong> des investisseurs : peur ou enthousiasme.</li></ul>
<p>Le marché regarde devant lui : une bonne nouvelle déjà anticipée peut ne pas faire monter le cours. La <strong>volatilité</strong> mesure l'ampleur de ces variations.</p>
<div class="gtip"><strong>À retenir :</strong> un cours qui monte ne prouve pas que l'entreprise est excellente, et un cours qui baisse ne prouve pas l'inverse.</div>`},
{t:"Lire une fiche",b:`<p>Quelques repères que tu retrouves dans la fiche de chaque entreprise :</p>
<ul><li><strong>Clôture précédente</strong> : le dernier cours de la séance d'avant. La variation en % se calcule par rapport à lui.</li><li><strong>Ouverture</strong> : le premier cours du jour.</li><li><strong>Plus haut / plus bas du jour</strong> : les extrêmes de la séance.</li><li><strong>Volume</strong> : le nombre d'actions échangées. Un volume élevé indique beaucoup d'intérêt.</li><li><strong>52 semaines</strong> : le cours le plus bas et le plus haut de l'année écoulée. Ils montrent où se situe le cours actuel dans sa fourchette habituelle.</li></ul>`},
{t:"Gains, pertes et frais",b:`<p>Tant que tu n'as pas vendu, un gain ou une perte est <strong>latent</strong> : il existe sur le papier mais peut encore changer. Il devient <strong>réalisé</strong> quand tu vends.</p>
<div class="gex"><strong>Exemple (frais de 0,2 %) :</strong> tu achètes pour 100 €. Après 0,20 € de frais, 99,80 € sont investis. Le cours monte de 10 % : ta position vaut 109,78 €. À la vente, 0,22 € de frais : tu reçois environ <strong>109,56 €</strong>, soit un gain d'environ 9,56 € et non 10 €.</div>
<p>Les frais paraissent petits, mais ils s'additionnent quand on achète et vend souvent.</p>
<div class="gtip"><strong>Une règle importante :</strong> après une baisse de 50 %, il faut une hausse de <strong>100 %</strong> pour revenir au point de départ. Limiter les grosses pertes compte autant que chercher les gains.</div>`},
{t:"Risque et diversification",b:`<p>Investir comporte un <strong>risque de perte</strong>. En général, plus un placement peut rapporter, plus il est risqué.</p>
<p>Mettre tout son argent sur une seule entreprise, c'est tout miser sur elle. La <strong>diversification</strong> consiste à répartir : plusieurs entreprises, plusieurs <strong>secteurs</strong> (technologie, santé, énergie…), plusieurs pays.</p>
<p>Elle réduit le risque lié à une entreprise, mais ne supprime pas celui du marché entier, qui peut baisser en bloc.</p>
<div class="gtip"><strong>En vrai :</strong> on n'investit que de l'argent dont on n'aura pas besoin à court terme.</div>`},
{t:"Les types d'ordres",b:`<p>Un <strong>ordre</strong> est une instruction donnée à un courtier pour acheter ou vendre.</p>
<ul><li>L'<strong>ordre au marché</strong> : acheter ou vendre tout de suite au prix disponible. C'est ce que font les boutons Acheter et Vendre du jeu.</li><li>L'<strong>ordre limite</strong> : tu fixes le prix maximum d'achat ou minimum de vente, et l'ordre n'est exécuté que s'il est atteint. Les ordres à seuil du jeu s'en inspirent.</li><li>L'<strong>ordre stop</strong> : il vend automatiquement si le prix descend jusqu'à un niveau, pour limiter une perte. Le jeu ne le propose pas, mais il existe chez les courtiers.</li></ul>`},
{t:"Court terme, long terme",b:`<p>À court terme, les cours bougent beaucoup pour des raisons difficiles à prévoir : c'est du « bruit ». Essayer de deviner chaque mouvement ressemble souvent à de la spéculation.</p>
<p>À long terme, les marchés d'actions ont historiquement eu tendance à progresser, avec des baisses parfois fortes entre-temps. <strong>Ce n'est pas une garantie.</strong></p>
<ul><li>La <strong>patience</strong> aide à ne pas vendre dans la panique.</li><li>Investir <strong>régulièrement</strong> de petites sommes lisse le prix d'achat.</li><li>Les <strong>émotions</strong> (peur, euphorie) sont l'ennemi numéro un de l'investisseur.</li></ul>`},
{t:"Mini-lexique",b:`<ul><li><strong>Action</strong> : part d'une entreprise.</li><li><strong>Dividende</strong> : part des bénéfices versée aux actionnaires.</li><li><strong>Plus-value / moins-value</strong> : gain / perte en vendant.</li><li><strong>Indice</strong> : panier d'entreprises qui résume un marché.</li><li><strong>Volatilité</strong> : ampleur des variations d'un cours.</li><li><strong>Capitalisation boursière</strong> : valeur totale d'une entreprise en bourse (cours × nombre d'actions).</li><li><strong>PER</strong> : cours divisé par le bénéfice par action ; il indique combien on paie pour 1 € de bénéfice.</li><li><strong>ETF</strong> : fonds coté en bourse qui suit un indice.</li><li><strong>Marché haussier / baissier</strong> : période durable de hausse / de baisse.</li><li><strong>Liquidité</strong> : facilité à acheter ou vendre sans bouger le prix.</li><li><strong>Courtier</strong> : intermédiaire qui passe tes ordres en bourse.</li><li><strong>ADR</strong> : titre qui permet de coter aux États-Unis une entreprise étrangère.</li></ul>`},
{t:"Bons réflexes et pièges",b:`<ul><li>Comprends <strong>ce que fait l'entreprise</strong> avant d'acheter.</li><li>Lis les résultats et les actualités, avec un œil critique.</li><li>Méfie-toi des « <strong>conseils</strong> » sur les réseaux sociaux et des promesses de gains garantis : aucun gain n'est garanti.</li><li>Ne <strong>t'endette jamais</strong> pour investir quand on débute.</li><li>Garde une <strong>épargne de précaution</strong> à part.</li></ul>
<p>En France, on investit en bourse via une banque ou un courtier en ligne, par exemple dans un <strong>PEA</strong> ou un <strong>compte-titres</strong>, qui n'ont pas la même fiscalité : renseigne-toi avant de te lancer pour de vrai.</p>
<div class="gtip"><strong>Rappel :</strong> ce livret est éducatif et ne constitue pas un conseil en investissement.</div>`}
]}];

function drawTape(force){

async function loadHist(k,r){
  const key=k+"|"+r,e=HIST[key];
  if(e&&(e.loading||Date.now()-e.ts<(e.err?60000:600000)))return;
  const rg=RANGES.find(x=>x[0]===r),prev=e&&e.pts;HIST[key]={loading:true,pts:prev,ts:Date.now()};
  try{
    const rangeMap={3600:["1d","1m"],86400:["1d","5m"],604800:["5d","30m"],2592000:["1mo","1d"],15552000:["6mo","1d"],31536000:["1y","1d"]};
    const [yr,yi]=rangeMap[r]||["1mo","1d"];let root,pts;
    try{
      await getRate();if(yahooErr&&APIKEY)throw new Error("Yahoo indisponible");root=await yahooChart(k,yr,yi);const q=((root.indicators||{}).quote||[])[0]||{},ts=root.timestamp||[],cl=q.close||[];
      pts=ts.map((t,i)=>[t,+cl[i]*rate]).filter(p=>p[1]>0);if(r===3600)pts=pts.slice(-60);
      if(pts.length>1){HIST[key]={pts,ts:Date.now(),source:"Yahoo Finance"};}
      else throw new Error("historique Yahoo incomplet");
    }catch(yerr){
      if(!APIKEY)throw yerr;
      await getRate();const j=await tdGet("time_series","symbol="+encodeURIComponent(k)+"&interval="+rg[2]+"&outputsize="+rg[3],1);
      if(j.status==="error"||!j.values)throw new Error(j.message||String(yerr.message||yerr));
      pts=j.values.map(v=>[Math.floor(Date.parse(v.datetime.replace(" ","T"))/1000),+v.close*rate]).filter(p=>p[1]>0).reverse();
      HIST[key]={pts,ts:Date.now(),source:"Twelve Data"};
    }
  }catch(err){HIST[key]={err:String(err.message||err).slice(0,100),ts:Date.now(),pts:prev}}
  if(openSym===k&&MR===r){const el=document.getElementById("mchart");if(el)el.innerHTML=chartFor(k)}
}

function pathChart(pts){
  const n=pts.length;if(n<2)return'<div class="empty">Pas assez de données pour cette période.</div>';
  const W=640,H=230,L=46,R=10,T=14,B=26,vs=pts.map(p=>p[1]);let mn=Math.min(...vs),mx=Math.max(...vs);if(mx-mn<.005){mn-=.5;mx+=.5}
  const X=i=>L+i/(n-1)*(W-L-R),y=v=>H-B-(v-mn)/(mx-mn)*(H-B-T),a=pts[0][0],b=pts[n-1][0],ch=(vs[n-1]/vs[0]-1)*100,c=ch>=0?"var(--up)":"var(--down)";
  const fmt=t=>{const z=new Date(t*1000),h=z.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"}),dd=z.toLocaleDateString("fr-FR",{day:"2-digit",month:"2-digit",year:b-a>200*86400?"2-digit":undefined});return b-a>5*86400?dd:b-a>86400?dd+" "+h:h};
  return`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Évolution du cours"><line x1="${L}" x2="${W-R}" y1="${y(mx)}" y2="${y(mx)}" stroke="var(--line)"/><line x1="${L}" x2="${W-R}" y1="${y(mn)}" y2="${y(mn)}" stroke="var(--line)"/><text x="2" y="${y(mx)+4}" font-size="10" fill="var(--mute)">${mx.toFixed(2)}</text><text x="2" y="${y(mn)+4}" font-size="10" fill="var(--mute)">${mn.toFixed(2)}</text><text x="${L}" y="${H-8}" font-size="10" fill="var(--mute)">${fmt(a)}</text><text x="${W-R}" y="${H-8}" font-size="10" text-anchor="end" fill="var(--mute)">${fmt(b)}</text><polyline points="${pts.map((p,i)=>X(i).toFixed(1)+","+y(p[1]).toFixed(1)).join(" ")}" fill="none" stroke="${c}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${X(n-1).toFixed(1)}" cy="${y(vs[n-1])}" r="3.5" fill="${c}"/></svg><div class="${cls(ch)}" style="font-size:13px">Sur cette période : ${pct(ch)} · plus bas ${eur(Math.min(...vs))} · plus haut ${eur(Math.max(...vs))}</div>`;
}

  if(!ready(k))return'— <small style="color:var(--mute);font-size:13px">chargement du cours…</small>';
  const d=(S.prices[k]/S.open[k]-1)*100,a=ageText(k);
  return`${eur(S.prices[k])} <span class="${cls(d)}" style="font-size:14px">${pct(d)} ${chgLabel()}</span>${a?`<div style="font-size:12px;color:var(--mute);font-weight:400">${a}</div>`:""}`;
}
function drawModal(){
  const k=openSym;if(!k)return;const p=S.pos[k],n=S.orders.filter(o=>o.sym===k).length,R=ready(k);
  modal.innerHTML=`<div class="box" role="dialog" aria-label="${STOCKS[k][0]}"><div class="mh"><h2>${logo(k)}${STOCKS[k][0]} <small style="color:var(--mute)">${k}</small></h2><button class="btn" data-close="1" style="background:var(--mute)">Fermer</button></div>
  <div style="color:var(--mute);font-size:13px;margin-bottom:6px">${sec(k)} · ${S.q[k]&&S.q[k].ex?esc(S.q[k].ex):"Marché boursier"}</div><div class="card" style="margin:10px 0 14px;background:var(--bg)"><b>À propos de l’entreprise</b><p style="font-size:13.5px;line-height:1.55;margin:6px 0 0">${esc(companyDescription(k))}</p></div>
  <div class="price" id="mprice">${priceHtml(k)}</div>
  <div class="rng" role="group" aria-label="Période du graphique">${RANGES.map(r=>`<button class="rb ${r[0]===MR?"on":""}" data-range="${r[0]}">${r[1]}</button>`).join("")}</div>
  <div id="mchart">${chartFor(k)}</div>
  <div id="minfo">${infoHtml(k)}</div>
  <div class="row" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><input type="number" min="1" step="1" value="10" id="m_amt" aria-label="Montant en euros">€ <button class="btn" data-mbuy="1">Acheter</button>
  ${p?`<button class="btn sell" data-msell="1">Vendre tout (${eur(p.qty*S.prices[k])})</button>`:""}
  <span style="font-size:12px;color:var(--mute)">Fiche entreprise en français ci-dessus</span></div>
  <div style="margin-top:14px;font-size:13.5px"><b>Ordre à seuil</b> <span title="S'exécute tout seul quand le prix atteint ton seuil, tant que l'appli est ouverte (achat : utilise le montant ci-dessus).">ⓘ</span>
  <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px"><input id="o_price" class="ctl" type="number" step="0.01" value="${R?S.prices[k].toFixed(2):""}" style="width:110px" aria-label="Prix seuil en euros"> €
  <button class="btn" data-ord="buy">Acheter si prix ≤</button><button class="btn sell" data-ord="sell">Vendre si prix ≥</button></div>
  ${n?`<div style="color:var(--mute);margin-top:4px">${n} ordre(s) en attente (voir Portefeuille)</div>`:""}</div>
  <p style="font-size:13px;color:var(--mute)">Capital disponible : ${eur(S.cash)}${p?" · Tu possèdes "+p.qty.toFixed(4).replace(".",",")+" action(s)":""}</p>
  <h3 class="ntitle">Actualités récentes (en français)</h3><div id="mnews">${newsHtml(k)}</div></div>`;
}
function refreshModal(){
  if(!openSym||!modal.classList.contains("on")||!document.getElementById("mprice"))return;const k=openSym;
  document.getElementById("mprice").innerHTML=priceHtml(k);const el=document.getElementById("minfo");if(el)el.innerHTML=infoHtml(k);
}
modal.addEventListener("click",e=>{
  if(e.target===modal||e.target.closest("[data-close]")){modal.classList.remove("on");openSym=null;return}
  const rg=e.target.closest("[data-range]");if(rg){MR=+rg.dataset.range;modal.querySelectorAll("[data-range]").forEach(b=>b.classList.toggle("on",+b.dataset.range===MR));document.getElementById("mchart").innerHTML=chartFor(openSym);return}
  if(e.target.closest("[data-doreset]")){S=ensure(fresh());save();modal.classList.remove("on");setStatus();render();toast("Compte remis à "+eur(START)+".");return}
  const ks=e.target.closest("[data-ksave]");if(ks){APIKEY=document.getElementById("kinp").value.trim();try{localStorage.setItem("td_key",APIKEY)}catch(x){}
    {const f=document.getElementById("kfh");if(f){try{localStorage.setItem("fh_key",f.value.trim())}catch(x){}}}for(const n in NEWSC)delete NEWSC[n];
    HIST={};liveErr=false;yahooErr=false;dayStop="";lastQuote=0;lastYahooAttempt=0;
    if(ks.dataset.ksave==="reset"){S=ensure(fresh());save()}
    toast(APIKEY?"Clé enregistrée.":"Clé supprimée : Yahoo Finance seul.");
    setStatus();modal.classList.remove("on");openSym=null;render();return}
  if(e.target.closest("[data-mbuy]")){doBuy(openSym,document.getElementById("m_amt").value)}
  if(e.target.closest("[data-msell]")){doSell(openSym)}
  const od=e.target.closest("[data-ord]");if(od){const k=openSym,pr=parseFloat(document.getElementById("o_price").value),amt=parseFloat(document.getElementById("m_amt").value),t=od.dataset.ord;
    if(!(pr>0))return toast("Entre un prix seuil.");
    if(t==="buy"&&!(amt>0))return toast("Entre un montant à acheter.");
    if(t==="sell"&&!S.pos[k])return toast("Tu ne possèdes pas cette action.");
    S.orders.push({sym:k,type:t,price:pr,amt});save();toast("Ordre enregistré.");drawModal()}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){modal.classList.remove("on");openSym=null}});
document.querySelectorAll("aside button[data-v]").forEach(b=>b.onclick=()=>{view=b.dataset.v;document.querySelectorAll("aside button[data-v]").forEach(x=>x.classList.toggle("on",x===b));render()});
document.getElementById("main").addEventListener("click",e=>{
  const b=e.target.closest("[data-buy]");if(b)doBuy(b.dataset.buy,document.getElementById("a_"+b.dataset.buy).value);
  const s=e.target.closest("[data-sell]");if(s)doSell(s.dataset.sell);
  const gq=e.target.closest("[data-gpart]");if(gq){GP={part:+gq.dataset.gpart,page:0};render();m_top();return}
  const gg=e.target.closest("[data-gpage]");if(gg){GP.page=+gg.dataset.gpage;render();m_top();return}
  const gn=e.target.closest("[data-gnav]");if(gn&&!gn.disabled){const P=GUIDE[GP.part];
    if(gn.dataset.gnav==="next"){if(GP.page<P.pages.length-1)GP.page++;else if(GP.part<GUIDE.length-1){GP.part++;GP.page=0}}
    else{if(GP.page>0)GP.page--;else if(GP.part>0){GP.part--;GP.page=GUIDE[GP.part].pages.length-1}}
    render();m_top();return}
  const gt=e.target.closest("[data-goto]");if(gt){view=gt.dataset.goto;document.querySelectorAll("aside button[data-v]").forEach(x=>x.classList.toggle("on",x.dataset.v===view));render();return}
  const mo=e.target.closest("[data-more]");if(mo){F.n+=24;document.getElementById("mlist").innerHTML=marketList();lastQuote=0;return}
  const f=e.target.closest("[data-fav]");if(f){S.fav[f.dataset.fav]=!S.fav[f.dataset.fav];save();document.getElementById("mlist").innerHTML=marketList();return}
  const c=e.target.closest("[data-cancel]");if(c){S.orders.splice(+c.dataset.cancel,1);save();render();return}
  const o=e.target.closest("[data-open]");if(o&&!b&&!s&&e.target.tagName!=="INPUT")openModal(o.dataset.open);
});
document.getElementById("reset").onclick=()=>{
  openSym=null;modal.innerHTML=`<div class="box"><div class="mh"><h2>Remettre à zéro ?</h2><button class="btn" data-close="1" style="background:var(--mute)">Fermer</button></div><p style="color:var(--mute)">Ton portefeuille et ton historique seront effacés, et tu repartiras avec ${eur(START)}.</p><div style="display:flex;gap:8px"><button class="btn sell" data-doreset="1">Oui, tout effacer</button><button class="btn" data-close="1" style="background:var(--mute)">Annuler</button></div></div>`;modal.classList.add("on")};
const mainEl=document.getElementById("main");
mainEl.addEventListener("input",e=>{if(e.target.id==="q"){F.q=e.target.value.toLowerCase();F.n=24;document.getElementById("mlist").innerHTML=marketList()}});
mainEl.addEventListener("change",e=>{if(["fsec","fsort","ffav"].includes(e.target.id)){F.sec=document.getElementById("fsec").value;F.sort=document.getElementById("fsort").value;F.fav=document.getElementById("ffav").checked;F.n=24;document.getElementById("mlist").innerHTML=marketList()}});
function applyTheme(t){document.documentElement.dataset.theme=t}
try{const t=localStorage.getItem("theme");if(t)applyTheme(t)}catch(e){}
document.getElementById("themebtn").onclick=()=>{const cur=document.documentElement.dataset.theme||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light"),n=cur==="dark"?"light":"dark";applyTheme(n);try{localStorage.setItem("theme",n)}catch(e){}};
document.getElementById("csvbtn").onclick=()=>{
  const n=x=>String(x).replace(".",",");
  const rows=[["Date","Type","Action","Quantité","Prix (€)","Montant (€)","Frais (€)","Ordre auto"]].concat(S.hist.slice().reverse().map(h=>[new Date(h.t).toLocaleString("fr-FR"),h.type,h.sym,n(h.qty.toFixed(4)),n(h.price.toFixed(2)),n(h.amt.toFixed(2)),n((h.fee||0).toFixed(2)),h.auto?"oui":"non"]));
  const blob=new Blob(["\ufeff"+rows.map(r=>r.join(";")).join("\n")],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="historique-bourse.csv";a.click();toast("Historique exporté (fichier CSV).");
};
const pb=document.getElementById("profbtn");
const AVS=["🦊","🐼","🦁","🐯","🦉","🐙","🚀","🧑‍💼","🦄","🐲"];
let W={mode:"login"};
const wel=document.getElementById("welcome");
function werr(m){const el=document.getElementById("werr");if(el)el.textContent=m}
function drawWelcome(){
  const isCreate=W.mode==="create";
  const body=isCreate
    ? `<h2>Créer ton compte</h2><input id="nemail" type="email" class="wi" placeholder="Adresse e-mail" autocomplete="email" aria-label="Adresse e-mail"><input id="np" class="wi" maxlength="20" placeholder="Pseudo" autocomplete="nickname" aria-label="Pseudo"><input id="npw" type="password" class="wi" placeholder="Mot de passe (6 caractères minimum)" autocomplete="new-password" aria-label="Mot de passe"><div class="wavs" role="radiogroup" aria-label="Avatar">${AVS.map((a,i)=>`<label class="wavl"><input type="radio" name="av" value="${a}" ${i===0?"checked":""}><span>${a}</span></label>`).join("")}</div><div id="werr" class="werr" role="alert"></div><button class="wbtn" data-docreate="1">Créer mon compte et commencer</button><button class="wlink" data-loginmode="1">J'ai déjà un compte</button>`
    : `<h2>Connexion</h2><p class="wsub">Connecte-toi avec le même compte sur ton ordinateur et ton téléphone.</p><input id="nemail" type="email" class="wi" placeholder="Adresse e-mail" autocomplete="email" aria-label="Adresse e-mail"><input id="npw" type="password" class="wi" placeholder="Mot de passe" autocomplete="current-password" aria-label="Mot de passe"><div id="werr" class="werr" role="alert"></div><button class="wbtn" data-dologin="1">Se connecter</button><button class="wlink" data-create="1">Créer un nouveau compte</button><button class="wlink" data-resetpw="1">Mot de passe oublié ?</button>`;
  wel.innerHTML=`<div class="wcard"><div class="wlogo">📈</div><h1>Simulateur de bourse</h1><p class="wsub">Ton compte et ton portefeuille seront sauvegardés en ligne.</p>${body}<p class="wnote">Utilise la même adresse e-mail et le même mot de passe sur tous tes appareils.</p></div>`;
}
function setLoggedIn(user, profile, state){
  fbUser=user; PROFILE=(profile&&profile.name)||((user.email||'').split('@')[0])||'Joueur'; KEY=KEYP+user.uid; LOGGED=true;
  S=ensure(state&&state.prices?state:load());
  try{localStorage.setItem(KEY,JSON.stringify(S));localStorage.setItem('profile',PROFILE)}catch(e){}
  pb.textContent='👤 '+PROFILE+' · déconnexion';
  wel.classList.remove('on');view='general';
  document.querySelectorAll('aside button[data-v]').forEach(x=>x.classList.toggle('on',x.dataset.v==='general'));
  lastQuote=0;checkGoals(true);setWho();drawTape(true);setStatus();render();
  if(!state || !state.prices) save();
  toast('Connecté : '+PROFILE);
}
async function handleLogin(){
  if(!fbReady)return werr('Firebase ne se charge pas. Vérifie ta connexion Internet.');
  const email=(document.getElementById('nemail').value||'').trim(),password=document.getElementById('npw').value;
  if(!email||!password)return werr('Saisis ton adresse e-mail et ton mot de passe.');
  try{const cred=await fbAuth.signInWithEmailAndPassword(email,password);const snap=await fbDb.ref('users/'+cred.user.uid).once('value');const data=snap.val()||{};setLoggedIn(cred.user,data.profile,data.state);}
  catch(e){werr(firebaseError(e));}
}
function firebaseError(e){const c=e&&e.code||'';if(c.includes('user-not-found')||c.includes('invalid-credential')||c.includes('wrong-password'))return 'Adresse e-mail ou mot de passe incorrect.';if(c.includes('email-already-in-use'))return 'Cette adresse e-mail possède déjà un compte. Connecte-toi.';if(c.includes('weak-password'))return 'Choisis un mot de passe de 6 caractères minimum.';if(c.includes('invalid-email'))return 'Adresse e-mail invalide.';if(c.includes('network-request-failed'))return 'Connexion Internet indisponible.';return 'Erreur Firebase : '+(e.message||c);}
async function handleCreate(){
  if(!fbReady)return werr('Firebase ne se charge pas. Vérifie ta connexion Internet.');
  const email=(document.getElementById('nemail').value||'').trim(),password=document.getElementById('npw').value,name=(document.getElementById('np').value||'').trim(),av=(wel.querySelector('input[name=av]:checked')||{}).value||AVS[0];
  if(!email||!name||!password)return werr('Remplis tous les champs.');if(name.length<2)return werr('Le pseudo doit contenir au moins 2 caractères.');if(password.length<6)return werr('Le mot de passe doit faire au moins 6 caractères.');
  try{const cred=await fbAuth.createUserWithEmailAndPassword(email,password);const state=ensure(fresh());await fbDb.ref('users/'+cred.user.uid).set({profile:{name,avatar:av},state});setLoggedIn(cred.user,{name,avatar:av},state);}
  catch(e){werr(firebaseError(e));}
}
wel.addEventListener('click',async e=>{const t=e.target.closest('button');if(!t)return;const d=t.dataset;if(d.create){W={mode:'create'};drawWelcome()}else if(d.loginmode){W={mode:'login'};drawWelcome()}else if(d.dologin)await handleLogin();else if(d.docreate)await handleCreate();else if(d.resetpw){const email=(document.getElementById('nemail').value||'').trim();if(!email)return werr('Saisis ton adresse e-mail pour recevoir le lien.');try{await fbAuth.sendPasswordResetEmail(email);werr('E-mail de réinitialisation envoyé. Vérifie ta boîte de réception.')}catch(e){werr(firebaseError(e));}}});
wel.addEventListener('keydown',e=>{if(e.key==='Enter'){const b=wel.querySelector('[data-dologin],[data-docreate]');if(b)b.click()}});
pb.onclick=async()=>{if(fbAuth&&fbAuth.currentUser){save();try{await fbAuth.signOut()}catch(e){}fbUser=null;LOGGED=false;PROFILE='';W={mode:'login'};drawWelcome();wel.classList.add('on');pb.textContent='Connexion';toast('Déconnecté.')}else{W={mode:'login'};drawWelcome();wel.classList.add('on')}};
if(fbReady){fbAuth.onAuthStateChanged(async user=>{if(!user){if(!LOGGED){W={mode:'login'};drawWelcome();wel.classList.add('on')}return;}try{const snap=await fbDb.ref('users/'+user.uid).once('value');const data=snap.val()||{};if(!LOGGED)setLoggedIn(user,data.profile,data.state);}catch(e){werr(firebaseError(e));}})}else{drawWelcome();wel.classList.add('on')}
if(typeof window!=="undefined")window.addEventListener("beforeunload",()=>save());
drawWelcome();wel.classList.add("on");setInterval(tick,3000);
</script>
